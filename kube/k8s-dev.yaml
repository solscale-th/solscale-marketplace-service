apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-service
  namespace: YOUR_NAMESPACE
spec:
  replicas: 1
  selector:
    matchLabels:
      app: store-service
      tier: backend
      track: stable
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      annotations:
        cloud.google.com/neg: '{"ingress": true}'
      labels:
        app: store-service
        tier: backend
        track: stable
    spec:
      containers:
        - name: store-service
          image: IMAGE_TAG
          resources:
            limits:
              memory: "2Gi"
            requests:
              memory: "1Gi"
          env:
            - name: NODE_ENV
              value: "development"
            - name: PORT
              value: "8000"
            - name: APP_NAME
              value: "Store Service"
            - name: APP_VERSION
              value: "0.1.0"
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: env-config-store
                  key: db.host
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: env-config-store
                  key: db.port
            - name: DB_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: env-config-store
                  key: db.database
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: env-secret-store
                  key: db.username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: env-secret-store
                  key: db.password
            - name: PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: env-secret-store
                  key: public.key
            - name: PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: env-secret-store
                  key: private.key
            - name: PASSPHRASE
              valueFrom:
                secretKeyRef:
                  name: env-secret-store
                  key: passphrase
            - name: LIMIT_FILE_SIZE
              valueFrom:
                configMapKeyRef:
                  name: env-config-store
                  key: limit.file.size

          ports:
            - containerPort: 8000
          livenessProbe:
            httpGet:
              path: "/healthz"
              port: 8000
            initialDelaySeconds: 10
            timeoutSeconds: 10
            periodSeconds: 30
            failureThreshold: 5

          readinessProbe:
            httpGet:
              path: "/healthz"
              port: 8000
            initialDelaySeconds: 10
            timeoutSeconds: 10
            periodSeconds: 30
            failureThreshold: 5
---

apiVersion: v1
kind: Service
metadata:
  name: store-service
  namespace: YOUR_NAMESPACE
  labels:
    name: store-service
spec:
  type: NodePort
  ports:
    - port: 3000
      targetPort: 8000
      name: store-service
  selector:
    app: store-service
    tier: backend
