type Job {
  id: Int
  entrepreneurId: Int
  title: String
  description: String
  brief: String
  platform: String
  deliverables: [String!]
  requirements: [String!]
  tags: [String!]
  location: String
  duration: String
  budgetMin: Int
  budgetMax: Int
  startAt: DateTime
  endAt: DateTime
  status: String
  promoted: Boolean
  visibility: String
  influencerId: Int
  postingDate: Date
  languages: [String!]
  caption: String
  requiredMessage: String
  forbiddenMessage: String
  packageName: String
  packageDetail: String
  packagePrice: Int
  createdAt: DateTime
  updatedAt: DateTime
  entrepreneur: Entrepreneur
  invites: [Application!]
  addons: [JobAddon!]
  requirementFiles: [JobRequirementFile!]
  myApplication: Application
}

type JobAddon {
  id: Int
  jobId: Int
  name: String
  price: Int
  createdAt: DateTime
  updatedAt: DateTime
}

type JobRequirementFile {
  id: Int
  jobId: Int
  kind: String
  required: Boolean
  fileUrl: String
  originalFilename: String
  createdAt: DateTime
  updatedAt: DateTime
}

type JobPayload {
  data: Job
  status: StatusPayload
}

type JobsPayload {
  data: [Job]
  status: StatusPayload
}

input JobAddonInput {
  name: String!
  price: Int!
}

input JobRequirementFileInput {
  kind: String!
  required: Boolean!
  fileUrl: String
  originalFilename: String
}

input CreateJobInput {
  title: String!
  description: String!
  brief: String
  platform: String!
  deliverables: [String!]
  requirements: [String!]
  tags: [String!]
  location: String
  duration: String
  budgetMin: Int
  budgetMax: Int
  startAt: DateTime
  endAt: DateTime
  inviteInfluencerIds: [Int!]
  visibility: String
  influencerId: Int
  postingDate: Date
  languages: [String!]
  caption: String
  requiredMessage: String
  forbiddenMessage: String
  packageName: String
  packageDetail: String
  packagePrice: Int
  addons: [JobAddonInput!]
  requirementFiles: [JobRequirementFileInput!]
}

input UpdateJobInput {
  id: Int!
  title: String
  description: String
  brief: String
  platform: String
  deliverables: [String!]
  requirements: [String!]
  tags: [String!]
  location: String
  duration: String
  budgetMin: Int
  budgetMax: Int
  startAt: DateTime
  endAt: DateTime
  status: String
}

input JobFilterInput {
  platforms: [String!]
  tags: [String!]
  location: String
  budgetMin: Int
  budgetMax: Int
}

type Query {
  jobs(limit: Int, offset: Int, search: String, filter: JobFilterInput): JobsPayload
  job(id: Int!): JobPayload
  myJobs: JobsPayload
  myRequestedJobs(limit: Int, offset: Int): JobsPayload
  myAcceptedJobs(limit: Int, offset: Int): JobsPayload
}

type Mutation {
  createJob(input: CreateJobInput!): JobPayload
  updateJob(input: UpdateJobInput!): JobPayload
}
