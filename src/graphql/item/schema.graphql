type Item {
  id: Int
  name: String
  description: String
  price: Float
  createdAt: DateTime
  updatedAt: DateTime
}

type ItemsPayload {
  data: [Item]
  status: StatusPayload
}

type ItemPayload {
  data: Item
  status: StatusPayload
}

input CreateItemInput {
  name: String!
  description: String
  price: Float!
}

type Query {
  items: ItemsPayload
}

type Mutation {
  createItem(input: CreateItemInput!): ItemPayload
}
