type Influencer {
  id: Int
  email: String
  firstName: String
  lastName: String
  stageName: String
  age: Int
  avatarUrl: String
  platforms: [String!]
  contentCategories: [String!]
  languages: [String!]
  bankName: String
  bankAccountName: String
  bankAccountNumber: String
  otherPhotos: [String!]
  countryCode: String
  phone: String
  bio: String
  averageRating: Float
  reviewCount: Int
  createdAt: DateTime
  updatedAt: DateTime
  packages: [InfluencerPackage!]
  addons: [InfluencerAddon!]
  portfolio: [InfluencerPortfolioItem!]
  reviews: [InfluencerReview!]
}

type InfluencerReview {
  id: Int
  influencerId: Int
  entrepreneurId: Int
  engagementId: Int
  rating: Int
  comment: String
  createdAt: DateTime
  updatedAt: DateTime
  entrepreneur: Entrepreneur
}

type InfluencerReviewPayload {
  data: InfluencerReview
  status: StatusPayload
}

type InfluencerPackage {
  id: Int
  influencerId: Int
  tier: String
  platform: String
  price: Int
  includes: [String!]
  revisions: Int
  turnaroundDays: Int
  createdAt: DateTime
  updatedAt: DateTime
}

type InfluencerAddon {
  id: Int
  influencerId: Int
  kind: String
  price: Int
  createdAt: DateTime
  updatedAt: DateTime
}

type InfluencerPortfolioItem {
  id: Int
  influencerId: Int
  title: String
  platform: String
  imageUrl: String
  createdAt: DateTime
  updatedAt: DateTime
}

type InfluencerPayload {
  data: Influencer
  status: StatusPayload
}

type InfluencersPayload {
  data: [Influencer]
  status: StatusPayload
}

type LoginInfluencerData {
  token: String
  influencer: Influencer
}

type LoginInfluencerPayload {
  data: LoginInfluencerData
  status: StatusPayload
}

input LoginInfluencerInput {
  email: String!
  password: String!
}

input LoginInfluencerWithGoogleInput {
  accessToken: String!
}

input LoginInfluencerWithLineInput {
  code: String!
  redirectUri: String!
}

input InfluencerPackageInput {
  tier: String!
  platform: String
  price: Int!
  includes: [String!]
  revisions: Int
  turnaroundDays: Int
}

input InfluencerAddonInput {
  kind: String!
  price: Int!
}

input InfluencerPortfolioItemInput {
  title: String!
  platform: String
  imageUrl: String
}

input UpdateInfluencerInput {
  email: String
  firstName: String
  lastName: String
  stageName: String
  age: Int
  avatarUrl: String
  platforms: [String!]
  contentCategories: [String!]
  languages: [String!]
  bankName: String
  bankAccountName: String
  bankAccountNumber: String
  otherPhotos: [String!]
  countryCode: String
  phone: String
  bio: String
  packages: [InfluencerPackageInput!]
  addons: [InfluencerAddonInput!]
  portfolio: [InfluencerPortfolioItemInput!]
}

input CreateInfluencerInput {
  email: String!
  password: String!
  firstName: String!
  lastName: String!
  stageName: String
  age: Int
  avatarUrl: String
  platforms: [String!]
  contentCategories: [String!]
  languages: [String!]
  bankName: String
  bankAccountName: String
  bankAccountNumber: String
  otherPhotos: [String!]
  countryCode: String
  phone: String
  bio: String
  packages: [InfluencerPackageInput!]
  addons: [InfluencerAddonInput!]
  portfolio: [InfluencerPortfolioItemInput!]
}

input ReviewInfluencerInput {
  influencerId: Int!
  engagementId: Int
  rating: Int!
  comment: String
}

input InfluencerFilterInput {
  categories: [String!]
  platforms: [String!]
  languages: [String!]
}

type Query {
  influencers(limit: Int, offset: Int, search: String, filter: InfluencerFilterInput): InfluencersPayload
  influencer(id: Int!): InfluencerPayload
}

type Mutation {
  createInfluencer(input: CreateInfluencerInput!): InfluencerPayload
  loginInfluencer(input: LoginInfluencerInput!): LoginInfluencerPayload
  loginInfluencerWithGoogle(input: LoginInfluencerWithGoogleInput!): LoginInfluencerPayload
  loginInfluencerWithLine(input: LoginInfluencerWithLineInput!): LoginInfluencerPayload
  updateInfluencer(input: UpdateInfluencerInput!): InfluencerPayload
  reviewInfluencer(input: ReviewInfluencerInput!): InfluencerReviewPayload
}
